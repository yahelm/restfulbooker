[project]
name = "restfulbooker"
version = "0.1.0"
description = "Pytest API test framework for Restful Booker"
readme = "README.md"
authors = [
    { name = "yahelm", email = "vladmelekh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "requests>=2.34.2",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.54.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "responses>=0.26.3",
    "ruff>=0.17.5",
    "types-requests>=2.33.0.20261030",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
log_level = "INFO"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["restfulbooker", "test_data"]

[tool.mypy]
strict = true
files = ["src", "test_data"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
